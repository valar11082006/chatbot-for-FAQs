<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>🤖 FAQ Chatbot</h2>
            <p>Ask me anything about technology!</p>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message bot">
                Hello! Welcome to FAQ Chatbot.
                Ask me a question about Python, AI, HTML, CSS, and more!
            </div>
        </div>

        <form id="chat-form" class="chat-form">
            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                autocomplete="off"
                required
            >

            <button type="submit" id="send-btn">Send</button>
        </form>

        <p class="footer">CodeAlpha AI Internship - Task 2</p>

    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const chatBox = document.getElementById("chat-box");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(text, sender) {
            const message = document.createElement("div");
            message.classList.add("message", sender);

            // Use textContent to safely display text
            message.textContent = text;

            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const question = input.value.trim();

            if (!question) return;

            addMessage(question, "user");
            input.value = "";
            sendBtn.disabled = true;

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                addMessage(
                    data.answer || "Sorry, something went wrong.",
                    "bot"
                );

            } catch (error) {
                addMessage(
                    "Unable to connect. Please try again.",
                    "bot"
                );
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>

</body>
</html>
